include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # The core is consumed from the pinned submodule (path dep) during
    # development; the release flow swaps it to the published version at
    # publish time, so the not-publishable-with-path-deps warning does
    # not apply to what actually ships.
    invalid_dependency: ignore
  exclude:
    # The pinned cellar core submodule — its own repo analyzes it; here
    # it's vendored source (same treatment as pdf_manipulator's vendor/).
    - 'cellar/**'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - comment_references
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_constructors_first
    - unawaited_futures
