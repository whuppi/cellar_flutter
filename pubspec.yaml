name: cellar_flutter
version: 1.0.0
description: >-
  Cross-platform file and data storage for Flutter, zero setup — files
  land in the right folder on Android, iOS, macOS, Windows, Linux, and
  web. Caching, auto-cleanup, encryption.
homepage: https://github.com/whuppi/cellar_flutter
repository: https://github.com/whuppi/cellar_flutter
issue_tracker: https://github.com/whuppi/cellar_flutter/issues

topics:
  - storage
  - cache
  - files
  - encryption
  - cross-platform

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The pure-Dart core this package fronts (and re-exports). The lock
  # certifies the exact version CI ran against; Dependabot bumps it per
  # cellar release. Local co-development: pubspec_overrides.yaml (see
  # CONTRIBUTING).
  cellar: ^1.0.0

  # Storage roots on native platforms (support + cache directories).
  # Imported only behind the native side of a conditional import — web
  # builds never compile it (path_provider's API returns dart:io types).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint rules
  flutter_lints: ^6.0.0

  # Fakes path_provider at its platform-interface seam in tests
  path_provider_platform_interface: ^2.1.2
