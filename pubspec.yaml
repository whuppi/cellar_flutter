name: cellar_flutter
version: 0.0.0
description: >-
  The Flutter front door for cellar: openCellar() resolves platform
  storage roots via path_provider and returns an opened, ready-to-use
  Cellar — one identical line on iOS, Android, macOS, Windows, Linux,
  and web. Re-exports the full cellar API.
homepage: https://github.com/whuppi/cellar_flutter
repository: https://github.com/whuppi/cellar_flutter
issue_tracker: https://github.com/whuppi/cellar_flutter/issues

topics:
  - storage
  - cache
  - encryption
  - indexeddb
  - cross-platform

# Not published yet — this line goes away when the repo opens and the
# release tooling takes over. Consumed by path from sewali + bokumi.
publish_to: none

environment:
  sdk: ">=3.11.0-0 <4.0.0"  # -0 floor: the pinned fvm SDK is a 3.11 beta

dependencies:
  flutter:
    sdk: flutter

  # The pure-Dart core this package fronts (and re-exports) — a pinned
  # git submodule of whuppi/cellar. CI clones --recursive; the release
  # flow swaps this to the published version.
  cellar:
    path: cellar

  # Storage roots on native platforms (support + cache directories).
  # Imported only behind the native side of a conditional import — web
  # builds never compile it (path_provider's API returns dart:io types).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint rules
  flutter_lints: ^6.0.0

  # Fakes path_provider at its platform-interface seam in tests
  path_provider_platform_interface: ^2.1.2
