name: cellar_flutter
version: 0.0.0
description: >-
  The Flutter front door for cellar: openCellar() resolves platform
  storage roots via path_provider and returns an opened, ready-to-use
  Cellar — one identical line on iOS, Android, macOS, Windows, Linux,
  and web. Re-exports the full cellar API.
homepage: https://github.com/whuppi/cellar_flutter
repository: https://github.com/whuppi/cellar_flutter
issue_tracker: https://github.com/whuppi/cellar_flutter/issues

topics:
  - storage
  - cache
  - encryption
  - indexeddb
  - cross-platform

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The pure-Dart core this package fronts (and re-exports). Development
  # resolves it from the pinned git submodule via the override below
  # (CI clones --recursive); a release publishes against the hosted
  # version and drops the override.
  cellar:
    path: cellar

  # Storage roots on native platforms (support + cache directories).
  # Imported only behind the native side of a conditional import — web
  # builds never compile it (path_provider's API returns dart:io types).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint rules
  flutter_lints: ^6.0.0

  # Fakes path_provider at its platform-interface seam in tests
  path_provider_platform_interface: ^2.1.2
